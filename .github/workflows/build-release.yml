name: Build Azeroth Plex

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  WXL_CORE_REF: v1.1
  # The helper is 64-bit (the 32-bit libmpv/OpenSSL couldn't open HTTPS or YouTube streams), so its libmpv is the
  # x86_64 build; the extension DLL stays Win32 for the 32-bit client.
  MPV_RELEASE: 20261014
  MPV_ARCHIVE: mpv-dev-x86_64-20261014-git-ec38361c56.7z
  # yt-dlp.exe goes beside the helper for CyTube's YouTube / Vimeo / Twitch media (mpv's ytdl hook runs it). Pinned:
  # the release, its exe's SHA-256 (GitHub's digest for the asset), and the git blob of its third-party licences.
  YTDLP_VERSION: 2026.10.21
  YTDLP_SHA256: 33121d192d706e62f684a06f80918e3f3a8ba52ac3a65213b6951c39c7d9f555
  YTDLP_LICENSES_BLOB: 88f9872c66b456703e91ca32db4041e1ec47258d

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Azeroth Plex
        uses: actions/checkout@v4

      - name: Checkout WarcraftXL ABI 1.1 core
        uses: actions/checkout@v4
        with:
          repository: WarcraftXL/wxl-core
          ref: ${{ env.WXL_CORE_REF }}
          path: wxl-core
          fetch-depth: 1

      - name: Stage extension sources
        shell: powershell
        run: |
          $extensionRoot = Join-Path $env:GITHUB_WORKSPACE 'wxl-core/extensions/wxl-azeroth-plex'
          New-Item -ItemType Directory -Force -Path $extensionRoot | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'extension/src/*') `
            -Destination $extensionRoot -Recurse -Force

      - name: Download pinned x64 libmpv
        shell: powershell
        run: |
          $dependencyRoot = Join-Path $env:GITHUB_WORKSPACE 'third_party/mpv'
          $archive = Join-Path $env:RUNNER_TEMP $env:MPV_ARCHIVE
          New-Item -ItemType Directory -Force -Path $dependencyRoot | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$env:MPV_RELEASE/$env:MPV_ARCHIVE" `
            -OutFile $archive
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { $sevenZip = '7z.exe' }
          & $sevenZip x $archive "-o$dependencyRoot" -y
          if ($LASTEXITCODE -ne 0) { throw "libmpv extraction failed: $LASTEXITCODE" }

      - name: Download pinned yt-dlp
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'third_party/yt-dlp'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $release = "https://github.com/yt-dlp/yt-dlp/releases/download/$env:YTDLP_VERSION"
          foreach ($name in 'yt-dlp.exe', 'SHA2-256SUMS') {
            Invoke-WebRequest -Uri "$release/$name" -OutFile (Join-Path $root $name)
          }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/yt-dlp/yt-dlp/$env:YTDLP_VERSION/THIRD_PARTY_LICENSES.txt" `
            -OutFile (Join-Path $root 'THIRD_PARTY_LICENSES.txt')

          # The exe: as that release's SHA2-256SUMS lists it, and as pinned above.
          $actual = (Get-FileHash (Join-Path $root 'yt-dlp.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $line = Get-Content (Join-Path $root 'SHA2-256SUMS') |
            Where-Object { $_ -match '^[0-9a-fA-F]{64}\s+\*?yt-dlp\.exe$' } | Select-Object -First 1
          if (-not $line) { throw 'SHA2-256SUMS has no line for yt-dlp.exe' }
          $listed = ($line -split '\s+')[0].ToLowerInvariant()
          if ($actual -ne $listed) { throw "yt-dlp.exe hashes to $actual, but SHA2-256SUMS lists $listed" }
          if ($actual -ne $env:YTDLP_SHA256) { throw "yt-dlp.exe hashes to $actual, but the workflow pins $env:YTDLP_SHA256" }

          # The licences: the git blob at that tag.
          $bytes = [IO.File]::ReadAllBytes((Join-Path $root 'THIRD_PARTY_LICENSES.txt'))
          $header = [Text.Encoding]::ASCII.GetBytes("blob $($bytes.Length)`0")
          $sha1 = [Security.Cryptography.SHA1]::Create()
          $null = $sha1.TransformBlock($header, 0, $header.Length, $null, 0)
          $null = $sha1.TransformFinalBlock($bytes, 0, $bytes.Length)
          $blob = -join ($sha1.Hash | ForEach-Object { $_.ToString('x2') })
          if ($blob -ne $env:YTDLP_LICENSES_BLOB) { throw "THIRD_PARTY_LICENSES.txt is blob $blob, not $env:YTDLP_LICENSES_BLOB" }
          "yt-dlp $env:YTDLP_VERSION verified: $actual"

      - name: Build extension DLL
        shell: powershell
        run: |
          cmake -S wxl-core -B wxl-core/build/dll -A Win32
          cmake --build wxl-core/build/dll --config Release --target wxl-azeroth-plex

      - name: Build native helper
        shell: powershell
        run: |
          cmake -S host -B host/build -A x64 `
            -DMPV_ROOT="$env:GITHUB_WORKSPACE/third_party/mpv"
          # Everything, not just the helper: the tests below need their own executables.
          cmake --build host/build --config Release

      - name: Run native tests
        shell: powershell
        run: ctest --test-dir host/build -C Release --output-on-failure

      - name: Package versioned release
        id: package
        shell: powershell
        run: |
          $manifest = Get-Content 'wxl.json' -Raw | ConvertFrom-Json
          $version = $manifest.extension.version
          if ($manifest.extension.id -ne 'wxl-azeroth-plex') {
            throw "Manifest extension id is not wxl-azeroth-plex"
          }
          $packageName = "wxl-azeroth-plex-$version"
          $stage = Join-Path $env:RUNNER_TEMP $packageName
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "wxl-core/build/dll/Release/wxl-azeroth-plex.dll" $stage
          Copy-Item "host/build/Release/wxl-video-host.exe" $stage
          Copy-Item "third_party/mpv/libmpv-2.dll" $stage
          # yt-dlp beside the helper (checked in "Download pinned yt-dlp"), with its bundled components' licences.
          Copy-Item "third_party/yt-dlp/yt-dlp.exe" $stage
          Copy-Item "third_party/yt-dlp/THIRD_PARTY_LICENSES.txt" (Join-Path $stage 'yt-dlp-THIRD_PARTY_LICENSES.txt')
          Copy-Item 'wxl.json','README.md','LICENSE','MODIFICATIONS.md' $stage
          # The Stonewall TV sign as rendered with its Office fonts (the runner has none); the DLL renders a
          # fallback itself if the file is missing.
          Copy-Item 'assets/stonewall-sign.bin' $stage
          if (Test-Path 'THIRD_PARTY_NOTICES.md') {
            Copy-Item 'THIRD_PARTY_NOTICES.md' $stage
          }

          $archive = Join-Path $env:GITHUB_WORKSPACE "$packageName.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash
          "Package: $archive"
          "SHA256: $hash"
          "package_name=$packageName" >> $env:GITHUB_OUTPUT

      - name: Upload versioned package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: ${{ steps.package.outputs.package_name }}.zip
          if-no-files-found: error
